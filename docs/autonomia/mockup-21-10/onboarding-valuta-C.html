<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.pr{position:absolute;top:62px;left:16px;right:16px;display:flex;align-items:center;gap:14px}
.pr .bk{font-size:22px}
.pr .bar{flex:1;height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.pr .bar i{display:block;width:42%;height:100%;background:var(--brand);border-radius:3px}
.q{position:absolute;top:104px;left:20px;right:20px}
.q h1{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.02em;line-height:1.12}
.q p{font-size:14.5px;color:var(--muted);margin-top:6px}
.list{position:absolute;top:196px;left:16px;right:16px;display:flex;flex-direction:column;gap:10px}
.it{display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;background:#fff;border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.04)}
.it.y{border-color:#ffc9bb;background:#fffaf8}
.it .ph,.it .crop{width:68px;height:68px;border-radius:15px;--es:32px;flex:none}
.it b{display:block;font-family:var(--display);font-weight:600;font-size:15.5px}
.it span{font-size:12.5px;color:var(--muted)}
.it .tg{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.tg.f{background:#f1f0ee;color:#55595f}.tg.c{background:#eef4f4;color:var(--brand)}
.it .bt{margin-left:auto;display:flex;gap:7px}
.it .bt div{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--surface)}
.it .bt .up{background:var(--accent)}
.it .bt .dn{background:#d7d9dc}
.it .bt .off{opacity:.45}
.cta{position:absolute;left:16px;right:16px;bottom:40px;height:58px;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:16.5px;gap:8px}
.cta span{opacity:.7;font-weight:500}
</style></head><body><div class="screen">
<div data-sb=""></div>
<div class="pr"><i data-i="back" class="bk"></i><div class="bar"><i></i></div></div>

 <div class="it y"><div class="ph ph-wine" data-e="🍷"></div><div><b>Vineria Ombretta</b><span>Vineria · Pigneto</span><br><span class="tg c">Chicca</span></div><div class="bt"><div class="off">👎</div><div class="up">👍</div></div></div>

 <div class="it"><div class="ph ph-trat" data-e="🍝"></div><div><b>Osteria del Cardo</b><span>Osteria · Monti</span><br><span class="tg c">Chicca</span></div><div class="bt"><div>👎</div><div>👍</div></div></div>
 <div class="it"><div class="ph ph-coffee" data-e="🥐"></div><div><b>Pasticceria Ginestra</b><span>Colazione · Prati</span><br><span class="tg c">Chicca</span></div><div class="bt"><div>👎</div><div>👍</div></div></div>
